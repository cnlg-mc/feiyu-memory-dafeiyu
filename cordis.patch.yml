# 肥鱼日记 —— 让新开一个对话，用户依然感觉是同一条鱼。
#
# ⚠️ 这个文件必须是**顶层 YAML 数组**，否则 loader 会直接抛错。
#
# `id` 同时也是设置项的命名空间（v0.2 的界面会用到），改它等于换一个插件身份。
# `name` 必须等于 package.json 的 name。
#
# 所有选项都可以在这里的 `config:` 里写。留空即用默认值。
# 注意：**patch 的 config 是整体替换、不深合并**，所以只写你想改的键是安全的
# （只有你自己这一行会读它；但如果你在 profile 里覆写这一行，就要把想保留的键写全）。
#
# ⚠️ **这里写的值会覆盖 `src/core/config.mjs` 里的 default。**
# 改默认值时必须两处一起改，否则改了代码不生效 —— 2026-11-03 就栽在这上面：
# 代码里把预算提到 6000，这里还写着 2000，结果召回那栏被整段裁掉，
# 翻到的日记一条都送不到她眼前。

- insert:
    - id: feiyu-memory
      name: 'feiyu-memory-dafeiyu'
      config:
        # 档案目录。留空 = ~/.dsh/feiyu-diary
        # 想放到别处（比如同步盘）就写绝对路径。
        dataDir: ''
        # 总开关
        enabled: true
        # 把人格内核一起注入。装了 dsh-whale-persona 之类的人设插件就关掉它 ——
        # 我们只负责"我们之间发生过什么"，人设交给它们。
        includePersona: true
        # 注入预算（token）。成本封顶，与用了多久无关。
        #
        # 2000 → 6000（2026-11-03）。召回那栏从「最多 2 条摘要」改成「一批完整正文」，
        # 一批约 4800 token，2000 根本装不下 —— 会被整段裁掉，
        # 变成「她翻了，但什么都没送到」。
        budgetTokens: 6000
        # 固化用模型。留空 = 跟随你当前的默认模型。
        # 强烈建议就用便宜档：这一步是结构化抽取，用贵的反而会自由发挥、把档案写花。
        model: ''
        # 固化的思考档位：off / low / high / max。
        #
        # ⚠️ 保持 off。它**故意不跟随你聊天时选的档位** —— 这不是疏漏，是修过的 bug：
        # 跟随的时候，你在桌面端选了 high，后台每次写日记也在疯狂思考，
        # 900 个输出 token 全烧在推理上，正文一个字都没产出。
        # 症状是"收到 600 个 chunk / 0 字符"，请求正常、无报错、就是不记事。
        #
        # 结构化抽取不需要思考。要它思考就填 low，一般没必要。
        reasoningEffort: off
        maxTokens: 900
        # 第三方隐私泛化：人名/号码/地址这类"别人家的事"自动模糊掉，情绪保留。
        thirdPartyRedaction: true
        # 金额低于这个值就不动（"3 块钱的包子"要留着，那是生活）
        amountThreshold: 100
        # 日记重要度门槛，低于此值丢弃。
        # 调高 = 记性变挑；但注意**寒暄、试错、来回改口也会一起被扔掉** ——
        # 那些看着没信息量，却是"熟悉感"的原料。默认 0.15 是刻意留低的。
        minSalience: 0.15
        # ⚠️ 4.1 起**对自动注入不再生效**（那条路改成按分数门槛取了）。
        # 字段留着不删：删了老配置里的值会被静默忽略。改它不会有任何反应。
        highSim: 0.5
        # 「最近的事」最多列几条。这一栏**不走相似度**，只在新会话首轮/压缩后重灌。
        # 8 → 3（2026-11-03）：平时它不占地方，3 条够交代"我们上次在干什么"，
        # 省下的预算留给召回那栏。
        recentEntries: 3
        # 按相似度最多捞几条**完整正文**进注入（0 = 只留最近的事）。
        # 这是上限，不是目标数 —— 实际条数由下面的 recallScoreRatio 决定。
        recallFanout: 15
        # 召回门槛：只留分数 ≥ 最高分 × 此值的。
        # 越低给得越多，也越吵。0.85 砍过头了（查「南京」5 条全相关，只进 1 条），
        # 提到 0.7。
        recallScoreRatio: 0.7
        # ⚠️ 4.1 起**不生效**。条数改由 recallFanout 控。
        maxShowPerTurn: 4
        # ⚠️ 4.1 起**不生效**。"走神"那一步已经没有掷骰子了。
        wanderChance: 0.08
        # 低峰时段（峰谷分时定价的谷时）。把 deferToOffPeak 打开后，
        # 日记会攒到这段时间才写 —— 更便宜，而且本来就更像人（睡前整理）。
        offPeakHours: '00:30-08:30'
        deferToOffPeak: false
        # 开发期调试日志。默认关，且**绝不落盘日记内容**。
        debugLog: false
